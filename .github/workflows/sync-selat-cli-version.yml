name: Prepare coordinated SELAT runtime release

# A plugin runtime is a reviewed closure, not a floating CLI package. This workflow
# is intentionally manual: release owners provide the already-published exact CLI,
# discovery, and payment versions, then review the generated manifest/lock PR.
# It never merges or publishes a release.

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Exact published @selat-ai/selat-cli version (for example, 0.16.3)'
        required: true
        type: string
      discovery_version:
        description: 'Exact published @selat-ai/selat-discovery version (for example, 0.24.1)'
        required: true
        type: string
      pay_version:
        description: 'Exact published @selat-ai/selat-pay version (for example, 0.9.7)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: coordinated-selat-runtime-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'SELAT-AI/selat-plugins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Regenerate reviewed runtime closure
        run: |
          .github/scripts/regenerate-selat-runtime-lock.sh \
            '${{ inputs.cli_version }}' \
            '${{ inputs.discovery_version }}' \
            '${{ inputs.pay_version }}'

      - name: Validate locked runtime and installer contract
        run: |
          .github/scripts/validate-selat-runtime-lock.sh
          git diff --check

      - name: Open review PR
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: ci/selat-runtime-${{ inputs.cli_version }}-${{ inputs.discovery_version }}-${{ inputs.pay_version }}
          delete-branch: true
          commit-message: 'chore: refresh coordinated SELAT runtime closure'
          title: 'chore: refresh SELAT runtime (${{ inputs.cli_version }} / ${{ inputs.discovery_version }} / ${{ inputs.pay_version }})'
          body: |
            This PR was generated from the coordinated SELAT runtime release gate.

            | Component | Exact version |
            |---|---:|
            | `@selat-ai/selat-cli` | `${{ inputs.cli_version }}` |
            | `@selat-ai/selat-discovery` | `${{ inputs.discovery_version }}` |
            | `@selat-ai/selat-pay` | `${{ inputs.pay_version }}` |

            The workflow regenerated `selat-runtime-package.json` and its npm lockfile
            with lifecycle scripts disabled, then validated direct versions, npm
            integrity metadata, the `ws@8.21.0` override, the SessionStart
            installer's `npm ci --ignore-scripts` contract, and byte-identical
            vendored copies in `plugins/selat-hermes/` (subdirectory install).

            > Review and merge this PR only after the component release notes and
            > cross-repository compatibility checks have been approved. Merging changes
            > the runtime installed by every SELAT plugin SessionStart hook.

            Generated by `Prepare coordinated SELAT runtime release`.
